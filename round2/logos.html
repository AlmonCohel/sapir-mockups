<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספיר · 5 לוגואים</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Bellefair&family=Heebo:wght@300;800&family=Secular+One&family=Suez+One&family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:'Assistant',sans-serif;background:#141217;color:#EEE;padding:28px 16px 80px}
h1{font-size:34px;font-weight:800}.sub{opacity:.6;margin:6px 0 26px;font-size:16px;line-height:1.5}
.row{border-radius:28px;padding:22px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.n{font-size:12px;letter-spacing:.25em;opacity:.6}
.row h2{font-size:24px;font-weight:800;margin:2px 0 4px}
.row p.why{font-size:15px;line-height:1.55;opacity:.8;max-width:56ch}
.hero{display:grid;place-items:center;height:220px;margin:12px 0}
.hero svg{width:200px;height:200px;overflow:visible}
.kit{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.app{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.app svg{width:62px;height:62px}
.fav{display:flex;gap:10px;align-items:flex-end;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08)}
.fav svg:nth-child(1){width:16px;height:16px}.fav svg:nth-child(2){width:24px;height:24px}.fav svg:nth-child(3){width:32px;height:32px}
.lock{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;flex:1;min-width:230px}
.lock svg{width:42px;height:42px;flex:none}
.lock b{font-size:22px;font-weight:400;white-space:nowrap}
.lock small{display:block;font-size:11px;letter-spacing:.14em;opacity:.7;margin-top:1px;font-family:'Assistant';font-weight:700}
a.go{display:inline-block;margin-top:14px;font-weight:800;text-decoration:none}

/* 1 porcelain */
.r1{background:radial-gradient(120% 80% at 50% 0%,#fff,#E6EAF3);color:#0F2260}
.r1 .loop{stroke-dasharray:120;stroke-dashoffset:120;animation:paint 3.6s cubic-bezier(.6,.1,.2,1) infinite}
@keyframes paint{0%{stroke-dashoffset:120}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.r1 .seam{stroke-dasharray:30;stroke-dashoffset:30;animation:seam 3.6s infinite}
@keyframes seam{0%,45%{stroke-dashoffset:30}65%,100%{stroke-dashoffset:0}}
/* 2 music box */
.r2{background:radial-gradient(120% 80% at 50% 0%,#5A3622,#24140C);color:#F4EADA}
.r2 .t{transform-box:fill-box;transform-origin:bottom;animation:tine 2.8s ease-in-out infinite}
@keyframes tine{0%,10%{transform:scaleY(0)}30%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.r2 .key{transform-origin:45px 19px;animation:turn 2.8s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}
/* 3 bubbles */
.r3{background:linear-gradient(160deg,#F4F8F9,#BFE5E6);color:#0E3F4A}
.r3 .baby{transform-box:fill-box;transform-origin:center;animation:wob 3s ease-in-out infinite}
@keyframes wob{25%{transform:scale(1.08,.94)}50%{transform:scale(.95,1.06) translate(1px,-1px)}75%{transform:scale(1.03,.98)}}
.r3 .mom{animation:wob 4s ease-in-out -1s infinite;transform-box:fill-box;transform-origin:center}
.r3 .iri{animation:huer 6s linear infinite}
@keyframes huer{to{filter:hue-rotate(360deg)}}
/* 4 origami */
.r4{background:#F2ECE1;color:#26335E}
.r4 .f{transform-box:view-box;transform-origin:32px 36px;animation:fold 3.4s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes fold{0%{transform:scale(0) rotate(-90deg);opacity:0}35%,85%{transform:none;opacity:1}100%{opacity:0}}
.r4 .sheet{animation:sheet 3.4s infinite}
@keyframes sheet{0%{opacity:1}35%,100%{opacity:.35}}
/* 5 terrarium */
.r5{background:radial-gradient(120% 80% at 80% 0%,#F3E3A8,#DCE6CF 60%);color:#183A2E}
.r5 .stem{stroke-dasharray:22;stroke-dashoffset:22;animation:stem 3.6s ease-out infinite}
@keyframes stem{0%{stroke-dashoffset:22}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.r5 .lf{transform-box:fill-box;animation:leaf 3.6s cubic-bezier(.3,1.6,.5,1) infinite}
.r5 .lf1{transform-origin:0 100%;animation-delay:.2s}.r5 .lf2{transform-origin:100% 100%;animation-delay:.45s}
@keyframes leaf{0%,25%{transform:scale(0)}45%,90%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r1 .loop,.r1 .seam,.r5 .stem{stroke-dashoffset:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E4AE"/><stop offset=".45" stop-color="#C9A15A"/><stop offset="1" stop-color="#7E5E26"/></linearGradient>
  <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8ad8"/><stop offset=".35" stop-color="#7ce7ff"/><stop offset=".65" stop-color="#b18cff"/><stop offset="1" stop-color="#7cffc9"/></linearGradient>
  <filter id="brushy"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>

  <symbol id="L1" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="30" fill="#fff"/>
    <circle cx="32" cy="32" r="28.5" fill="none" stroke="#1B3C9E" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#1B3C9E" stroke-width=".7" stroke-dasharray="1.5 2.4"/>
    <circle cx="31" cy="31" r="10" fill="#5A78C9" opacity=".18"/>
    <path class="loop" filter="url(#brushy)" d="M44 22c-3-5-9-7-14-6-8 1.5-12 8-11 15 1 7 7 12 14 11.5 7-.5 12-6 12-12.5 0-3-1-5.5-3-7.5" fill="none" stroke="#1B3C9E" stroke-width="5" stroke-linecap="round"/>
    <path class="seam" d="M51 6 L46 14 L49 18 L43 26" fill="none" stroke="#C8A04A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="L2" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="30" fill="#2A1810" stroke="url(#brass)" stroke-width="2.5"/>
    <rect x="15" y="44" width="34" height="5" rx="1.5" fill="url(#brass)"/>
    <g fill="url(#brass)">
      <rect class="t" style="animation-delay:.0s" x="42" y="34" width="4" height="11" rx="2"/>
      <rect class="t" style="animation-delay:.12s" x="36" y="29" width="4" height="16" rx="2"/>
      <rect class="t" style="animation-delay:.24s" x="30" y="24" width="4" height="21" rx="2"/>
      <rect class="t" style="animation-delay:.36s" x="24" y="19" width="4" height="26" rx="2"/>
      <rect class="t" style="animation-delay:.48s" x="18" y="14" width="4" height="31" rx="2"/>
    </g>
    <g class="key"><circle cx="45" cy="19" r="5" fill="none" stroke="#F4DC9E" stroke-width="2.4"/></g>
    <path d="M45 24v6" stroke="#F4DC9E" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="L3" viewBox="0 0 64 64">
    <g class="iri">
      <circle class="mom" cx="27" cy="30" r="20" fill="rgba(255,255,255,.35)" stroke="url(#iri)" stroke-width="3.2"/>
      <circle class="baby" cx="47" cy="44" r="10" fill="rgba(255,255,255,.35)" stroke="url(#iri)" stroke-width="2.6"/>
    </g>
    <path d="M15 24a14 14 0 0 1 9-8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M42 40a6 6 0 0 1 4-3" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </symbol>
  <symbol id="L4" viewBox="0 0 64 64">
    <rect class="sheet" x="10" y="10" width="44" height="44" fill="#E7DECF" transform="rotate(45 32 32)"/>
    <g class="f"><polygon points="32,36 10,16 28,40" fill="#3D4E8A"/><polygon points="32,36 48,10 38,40" fill="#26335E"/>
    <polygon points="20,44 32,36 32,50" fill="#E9A23B"/><polygon points="32,36 46,44 32,50" fill="#D8613A"/>
    <polygon points="20,44 24,44 12,30" fill="#E9A23B"/><polygon points="46,44 42,44 56,30" fill="#D8613A"/></g>
  </symbol>
  <symbol id="L5" viewBox="0 0 64 64">
    <path d="M10 56V30a22 22 0 0 1 44 0v26z" fill="#F6F1E4" stroke="#183A2E" stroke-width="3"/>
    <path d="M14 56h36" stroke="#7A4E33" stroke-width="5" stroke-linecap="round"/>
    <path class="stem" d="M32 54V34" stroke="#5E8C4A" stroke-width="3" stroke-linecap="round"/>
    <path class="lf lf1" d="M32 38C32 28 40 22 48 23c0 9-7 15-16 15z" fill="#5E8C4A"/>
    <path class="lf lf2" d="M32 44c0-6-5-10-11-9.5 0 5.5 4.5 9.5 11 9.5z" fill="#8CBF6A"/>
    <path d="M16 30a16 16 0 0 1 8-12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </symbol>
</defs></svg>

<h1>ספיר פורסילן · 5 לוגואים</h1>
<p class="sub">כל לוגו נולד מהכיוון שלו ועובד כמערכת שלמה: סימן עם תנועה, אייקון לאפליקציה, פביקון בגדלים קטנים, ולוגו עם שם על רקע בהיר וכהה.</p>

<div id="rows"></div>

<script>
const R = [
  ['L1', 'פורצלן', 'האות ס׳ כמשיכת מכחול כחולה אחת על צלחת פורצלן. היא גם חיבוק סגור. קו זהב (קינצוגי) חוצה את השוליים: גם מה שנסדק אפשר לתקן, והוא יוצא יפה יותר.', "'Frank Ruhl Libre'", 500, '#fff', '#0F2260', '#1B3C9E', 'עדין כמו פורצלן', '1-porcelain.html'],
  ['L2', 'תיבת נגינה', 'מסרק של תיבת נגינה. השיניים שלו עולות כמו מדרגות: צעד אחר צעד. המפתח הקטן הוא מה שמפעיל את המנגינה. בתנועה השיניים עולות אחת אחת והמפתח מסתובב.', "'Bellefair'", 400, '#2A1810', '#2A1810', '#A47A35', 'לכל תינוק המנגינה שלו', '2-music-box.html'],
  ['L3', 'בועות', 'שתי בועות שנוגעות זו בזו: בועה של הורה ובועה של תינוק. בבועות אמיתיות, כשהן נוגעות יש להן קיר משותף אחד. הצבעים זזים כל הזמן, כמו על בועת סבון.', "'Heebo'", 800, '#E9F6F6', '#0E3F4A', '#1F6E78', 'רגע לנשום', '3-bubbles.html'],
  ['L4', 'אוריגמי', 'ציפור שקופלה מדף מרובע, והדף עדיין מאחוריה. בתנועה החלקים מתקפלים מתוך הדף, וזה בדיוק מה שהאתר עושה בפתיחה. היא נשארת חדה גם בגודל 16 פיקסלים.', "'Secular One'", 400, '#F2ECE1', '#26335E', '#D8613A', 'כל קיפול בזמן שלו', '4-origami.html'],
  ['L5', 'טרריום', 'כיפת זכוכית מעל נבט, ועל אותו גבעול עלה גדול ועלה קטן: הורה ותינוק. בתנועה הגבעול צומח והעלים נפתחים, בדיוק כמו בגלילה באתר.', "'Suez One'", 400, '#F6F1E4', '#183A2E', '#5E8C4A', 'דברים טובים גדלים לאט', '5-terrarium.html'],
];
document.getElementById('rows').innerHTML = R.map(([id, name, why, font, w, appBg, ink, accent, tag, href], i) => `
  <section class="row r${i + 1}">
    <div class="n">0${i + 1}</div><h2>${name}</h2><p class="why">${why}</p>
    <div class="hero"><svg><use href="#${id}"/></svg></div>
    <div class="kit">
      <div class="app" style="background:${appBg}"><svg><use href="#${id}"/></svg></div>
      <div class="fav"><svg><use href="#${id}"/></svg><svg><use href="#${id}"/></svg><svg><use href="#${id}"/></svg></div>
      <div class="lock" style="background:#fff;color:${ink}"><svg><use href="#${id}"/></svg><div><b style="font-family:${font};font-weight:${w}">ספיר פורסילן</b><small style="color:${accent}">${tag}</small></div></div>
      <div class="lock" style="background:${ink};color:#fff"><svg><use href="#${id}"/></svg><div><b style="font-family:${font};font-weight:${w}">ספיר פורסילן</b><small>${tag}</small></div></div>
    </div>
    <a class="go" href="${href}" style="color:${accent}">לכיוון המלא ←</a>
  </section>`).join('');
</script>
</body>
</html>
