<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספיר · לוגואים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Secular+One&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@800&family=Suez+One&family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:'Assistant',sans-serif;background:#F3EEE7;color:#2A2630;padding:30px 16px 80px}
.top{max-width:980px;margin:0 auto 22px}
h1{font-size:34px;font-weight:800}.sub{opacity:.7;margin-top:6px;font-size:16.5px;line-height:1.5;max-width:60ch}
.grid{max-width:980px;margin:auto;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:#fff;border-radius:28px;padding:20px 18px 22px;box-shadow:0 20px 50px -30px rgba(60,40,30,.35)}
.n{font-size:12px;letter-spacing:.25em;opacity:.5;font-weight:700}
.card h2{font-size:23px;font-weight:800;margin:2px 0 4px}
.card p{font-size:15px;line-height:1.5;opacity:.75}
.stage{height:230px;margin:14px 0;border-radius:22px;display:grid;place-items:center}
.stage svg{width:190px;height:190px;overflow:visible}
.kit{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.app{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.app svg{width:48px;height:48px}
.fav{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-radius:10px;background:#F3EEE7}
.fav svg:nth-child(1){width:16px;height:16px}.fav svg:nth-child(2){width:24px;height:24px}.fav svg:nth-child(3){width:32px;height:32px}
.lock{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;margin-top:8px}
.lock svg{width:46px;height:46px;flex:none}
.badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}.badge svg{width:40px;height:40px}
.lock b{font-size:23px;line-height:1;display:block;white-space:nowrap}
.lock small{display:block;font-size:12.5px;font-weight:700;margin-top:4px;letter-spacing:.04em;opacity:.85}

/* motion lives only on the big stage copy */
.stage .fl{animation:stepA 3.2s ease-in-out infinite}.stage .fr{animation:stepA 3.2s ease-in-out .55s infinite}
@keyframes stepA{0%{opacity:0;transform:translateY(8px)}18%,80%{opacity:1;transform:none}100%{opacity:0}}
.stage .crawl{animation:crawl 1.6s ease-in-out infinite}
@keyframes crawl{0%,100%{transform:translate(-3px,0)}50%{transform:translate(3px,-2px)}}
.stage .floor{animation:floor 1.6s linear infinite}
@keyframes floor{to{stroke-dashoffset:14}}
.stage .rock{transform-box:view-box;transform-origin:56px 88px;animation:rock 3.6s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.stage .ad{animation:bob 1.4s ease-in-out infinite}.stage .td{animation:bob .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.stage .cradle{transform-box:view-box;transform-origin:50px 30px;animation:rock 4.4s ease-in-out infinite}
.stage .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.5);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="m1x" viewBox="0 0 100 100">
  <g class="fl"><g fill="#E0825A" transform="translate(4 30) rotate(-14 50 60) scale(.62)"><use href="#footL"/></g></g>
  <g class="fr"><g fill="#7FA38A" transform="translate(38 2) rotate(-14 50 60) scale(.62)"><use href="#footR"/></g></g>
</symbol>
<symbol id="footR" viewBox="0 0 100 100"><path d="M50 93c-10 0-16-7-15.5-17 .4-8 2.6-12 1.6-20-1.4-11 5-19.5 14.5-19.5 10 0 15.5 8 14.3 20-.8 7.6-1 11-1 17.5 0 11-5.4 19-13.9 19z"/>
<ellipse cx="40" cy="28" rx="6.4" ry="7.4"/><circle cx="50.6" cy="23" r="4.6"/><circle cx="58.4" cy="24" r="4"/><circle cx="64.5" cy="28.4" r="3.4"/><circle cx="68.5" cy="34.6" r="3"/></symbol>
<symbol id="footL" viewBox="0 0 100 100"><g transform="translate(100 0) scale(-1 1)"><use href="#footR"/></g></symbol>
<symbol id="m2" viewBox="0 0 100 100"><g class="crawl"><g stroke="#E0825A" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M58 66 L54 82" stroke-width="7" opacity=".55"/>
<path d="M38 58 L46 80 L26 82" stroke-width="7" opacity=".55"/>
<path d="M60 52 C52 46 40 45 33 50" stroke-width="23"/>
<path d="M66 62 L68 82" stroke-width="7.5"/>
<path d="M32 60 L42 80 L22 82" stroke-width="8"/></g>
<circle cx="73" cy="41" r="13.5" fill="#E0825A"/></g>
<path class="floor" d="M12 90 H88" stroke="#E9C7A3" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 7"/></symbol>
<symbol id="m3" viewBox="0 0 100 100"><g class="rock"><circle cx="42" cy="25" r="12.5" fill="#2F6F73"/>
<path d="M33 44C24 62 27 84 50 89c17 3 32-6 35-24" fill="none" stroke="#2F6F73" stroke-width="13" stroke-linecap="round"/>
<ellipse cx="68" cy="64" rx="15" ry="10" transform="rotate(-14 68 64)" fill="#F2A65A"/>
<circle cx="50" cy="58" r="9.5" fill="#F2A65A"/></g></symbol>
<symbol id="m4" viewBox="0 0 100 100"><g class="ad" fill="#34406B" stroke="#34406B" stroke-linecap="round">
<circle cx="36" cy="17" r="9.5" stroke="none"/><circle cx="29" cy="10" r="5" stroke="none"/>
<path d="M28 33h16l-2 29H30z" stroke-width="6" stroke-linejoin="round"/>
<path d="M32 62 L28 92M40 62 L46 92" stroke-width="8" fill="none"/>
<path d="M27 37 L21 58M45 37 L55 57" stroke-width="7" fill="none"/></g>
<g class="td" fill="#F0B43C" stroke="#F0B43C" stroke-linecap="round">
<circle cx="71" cy="51" r="10" stroke="none"/>
<path d="M65 66h12l-1 13h-10z" stroke-width="5.5" stroke-linejoin="round"/>
<path d="M68 80 L64 93M74 80 L79 92" stroke-width="7" fill="none"/>
<path d="M65 68 L57 59M77 68 L82 77" stroke-width="5.5" fill="none"/></g></symbol>
<symbol id="m5" viewBox="0 0 100 100"><g class="cradle"><path d="M50 8a43 43 0 1 0 42.6 37.5A35 35 0 1 1 50 8z" fill="#F6D98B"/>
<path d="M44 74 C46 62 62 56 80 60 C86 62 86 70 80 73 C68 78 54 79 44 74z" fill="currentColor"/>
<circle cx="45" cy="60" r="11" fill="#FFDCC4"/>
<g fill="none" stroke="#7A4E3A" stroke-width="1.7" stroke-linecap="round"><path d="M40 60.5q2.2 2 4.4 0"/><path d="M47.5 60.5q2.2 2 4.4 0"/></g>
<circle cx="40" cy="65" r="2" fill="#F7A99A" opacity=".8"/>
<path d="M58 68 C64 65 72 65 78 67" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
</g><g fill="#F6D98B"><path class="tw" d="M80 14l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z"/><circle cx="91" cy="31" r="1.6"/></g></symbol>
</defs></svg>
<div class="top">
  <h1>ספיר פורסילן · 5 לוגואים</h1>
  <p class="sub">כל לוגו מראה משהו אמיתי מהעבודה של ספיר: התפתחות התינוק והקשר בין הורה לתינוק. כל אחד מוצג כמערכת שלמה: סימן עם תנועה, אייקון לאפליקציה, פביקון בגדלים הקטנים, ולוגו עם שם על רקע בהיר וכהה.</p>
</div>
<div class="grid" id="g"></div>
<script>
const L = [
  ['m1x', 'צעדים ראשונים', 'שתי כפות רגליים של תינוק שעולות באלכסון. זה הסלוגן שלה, "צעד אחר צעד", כציור.', "'Rubik'", 700, '#FBF3EA', '#3B2A22', '#E0825A', 'צעד אחר צעד', 'inherit'],
  ['m2', 'זוחלים קדימה', 'תינוק זוחל, אבן דרך מוטורית שעומדת במרכז שיטת "צעד ראשון". הנקודות מאחוריו הן הדרך שכבר עשה.', "'Secular One'", 400, '#FBEDE4', '#5A2E1C', '#E0825A', 'מתפתחים בקצב שלהם', 'inherit'],
  ['m3', 'בידיים', 'אמא שמחזיקה תינוק עטוף. הזרוע שלה היא ערסל: מחזיקה, אבל לא סוגרת. וזה בדיוק הליווי.', "'Frank Ruhl Libre'", 700, '#E6F0EE', '#1E4A4D', '#2F6F73', 'ליווי לאמא ולתינוק', 'inherit'],
  ['m4', 'יד ביד', 'אמא ופעוט הולכים יחד, יד ביד. הוא נעזר בה עכשיו, ובקרוב ילך לבד.', "'Heebo'", 800, '#FFF4DA', '#232B4D', '#C98A12', 'ביחד, בביטחון', 'inherit'],
  ['m5', 'לילה טוב', 'תינוק ישן בתוך ירח שמתנדנד כמו עריסה. בשביל ייעוץ השינה, וגם פשוט מרגיע להסתכל.', "'Suez One'", 400, '#2D2A5A', '#2D2A5A', '#B08A2E', 'לילות רגועים', '#2D2A5A'],
];
const sym = id => document.getElementById(id);
document.getElementById('g').innerHTML = L.map(([id, name, why, font, w, stageBg, ink, accent, tag], i) => `
  <section class="card">
    <div class="n">0${i + 1}</div><h2>${name}</h2><p>${why}</p>
    <div class="stage" style="background:${stageBg};color:${id === 'm5' ? '#fff' : ink}"><svg viewBox="0 0 100 100">${sym(id).innerHTML}</svg></div>
    <div class="kit">
      <div class="app" style="background:${id === 'm5' ? '#2D2A5A;color:#fff' : stageBg + ';color:' + ink}"><svg><use href="#${id}"/></svg></div>
      <div class="fav" style="color:${ink}"><svg><use href="#${id}"/></svg><svg><use href="#${id}"/></svg><svg><use href="#${id}"/></svg></div>
    </div>
    <div class="lock" style="background:#F7F3EE;color:${ink}"><svg><use href="#${id}"/></svg><div><b style="font-family:${font};font-weight:${w}">ספיר פורסילן</b><small style="color:${accent}">${tag}</small></div></div>
    <div class="lock" style="background:${ink};color:#fff"><span class="badge" style="background:${id === 'm5' ? '#2D2A5A' : stageBg};color:${id === 'm5' ? '#fff' : ink}"><svg><use href="#${id}"/></svg></span><div><b style="font-family:${font};font-weight:${w}">ספיר פורסילן</b><small>${tag}</small></div></div>
  </section>`).join('');
</script>
</body>
</html>
